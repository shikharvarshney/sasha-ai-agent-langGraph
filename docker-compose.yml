version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sasha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sasha-sales-ai
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "sasha:"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-sasha-ai-agent-langGraph}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-10000.0}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
